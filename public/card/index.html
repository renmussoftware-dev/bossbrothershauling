<style>
  /* --------------------------------------------------------------------
     Digital business card. Deliberately self-contained: no stylesheet, no
     script, no font and no image is fetched at runtime, so the page opens
     instantly on a phone with one bar of signal in somebody's driveway.
     Palette and logo come from the deployed site (see marketing/ads/livesite.ts).
     -------------------------------------------------------------------- */
  :root {
    --ink: #0B0B0C;
    --panel: #121214;
    --bone: #F6F3EC;
    --muted: #A8A49C;
    --gold: #D4A537;
    --gold-soft: #EFD27A;
    --gold-deep: #8F661D;
    --edge: rgba(212, 165, 55, .22);
    --font-display: Georgia, 'Times New Roman', 'Iowan Old Style', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--ink);
    color: var(--bone);
    font-family: var(--font-body);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* Dark marble: an anisotropic fractal-noise field (streaky in x, stretched
     in y) layered over a charcoal ramp. Inline SVG filter, so it costs one
     data URI and scales to any screen without a texture file. */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -2;
    background:
      radial-gradient(120% 70% at 50% -10%, #26262A 0%, #151517 38%, var(--ink) 78%),
      var(--ink);
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    opacity: .5;
    mix-blend-mode: screen;
    background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'760'%20height%3D'760'%20viewBox%3D'0%200%20760%20760'%3E%3Cfilter%20id%3D'vein'%20x%3D'-40%25'%20y%3D'-40%25'%20width%3D'180%25'%20height%3D'180%25'%3E%3CfeTurbulence%20type%3D'fractalNoise'%20baseFrequency%3D'0.006%200.055'%20numOctaves%3D'4'%20seed%3D'9'%2F%3E%3CfeColorMatrix%20type%3D'saturate'%20values%3D'0'%2F%3E%3CfeComponentTransfer%3E%3CfeFuncA%20type%3D'gamma'%20exponent%3D'5.5'%2F%3E%3C%2FfeComponentTransfer%3E%3CfeGaussianBlur%20stdDeviation%3D'0.6'%2F%3E%3C%2Ffilter%3E%3Cfilter%20id%3D'grain'%20x%3D'-40%25'%20y%3D'-40%25'%20width%3D'180%25'%20height%3D'180%25'%3E%3CfeTurbulence%20type%3D'fractalNoise'%20baseFrequency%3D'0.9'%20numOctaves%3D'3'%20seed%3D'4'%2F%3E%3CfeColorMatrix%20type%3D'saturate'%20values%3D'0'%2F%3E%3CfeComponentTransfer%3E%3CfeFuncA%20type%3D'gamma'%20exponent%3D'6'%2F%3E%3C%2FfeComponentTransfer%3E%3C%2Ffilter%3E%3Cg%20transform%3D'rotate(-28%20380%20380)'%3E%3Crect%20x%3D'-300'%20y%3D'-300'%20width%3D'1360'%20height%3D'1360'%20filter%3D'url(%23vein)'%20opacity%3D'.85'%2F%3E%3C%2Fg%3E%3Crect%20width%3D'760'%20height%3D'760'%20filter%3D'url(%23grain)'%20opacity%3D'.25'%2F%3E%3C%2Fsvg%3E");
    background-size: cover;   /* cover, not tile — a repeat would show seams */
    background-position: center;
    pointer-events: none;
  }

  .card {
    width: 100%;
    max-width: 30rem;
    margin: 0 auto;
    padding: calc(2.25rem + env(safe-area-inset-top)) 1.25rem
             calc(2rem + env(safe-area-inset-bottom));
    text-align: center;
  }

  /* ---- Identity ---- */
  .logo {
    width: 116px;
    height: auto;
    display: block;
    margin: 0 auto;
    filter: drop-shadow(0 10px 26px rgba(0, 0, 0, .75));
  }

  h1 {
    margin: 1.15rem 0 0;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(1.75rem, 8.5vw, 2.35rem);
    line-height: 1.06;
    letter-spacing: .06em;
    text-transform: uppercase;
    background: linear-gradient(#FBF0C9, #E5BC55 38%, #B8862A 52%, #F0DA9B 74%, #C9992E);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    /* Fallback for engines that ignore background-clip on text. */
    -webkit-text-fill-color: transparent;
  }
  h1 .line2 { display: block; }

  .rule {
    width: 78px;
    height: 2px;
    margin: 1rem auto .95rem;
    border: 0;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .services {
    margin: 0;
    font-size: .8125rem;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--gold-soft);
  }

  .area {
    margin: .45rem 0 0;
    font-size: .9375rem;
    color: var(--muted);
  }

  /* ---- Actions ---- */
  .actions {
    display: grid;
    gap: .625rem;
    margin-top: 1.85rem;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .625rem;
    min-height: 56px;
    padding: .875rem 1.125rem;
    border: 1px solid var(--edge);
    border-radius: 14px;
    background: linear-gradient(160deg, #26262A, #1B1B1E 45%, var(--panel));
    color: var(--bone);
    font: inherit;
    font-size: 1rem;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform .12s ease, border-color .12s ease, background-color .12s ease;
  }
  .btn:active { transform: scale(.985); }
  .btn:hover { border-color: rgba(212, 165, 55, .45); }
  .btn:focus-visible {
    outline: 2px solid var(--gold-soft);
    outline-offset: 3px;
  }

  .btn--primary {
    min-height: 62px;
    border-color: transparent;
    background: linear-gradient(180deg, var(--gold-soft), var(--gold) 52%, var(--gold-deep));
    color: #16120A;
    font-size: 1.0625rem;
    font-weight: 700;
    letter-spacing: .01em;
    box-shadow: 0 8px 22px rgba(212, 165, 55, .22);
  }
  .btn--primary:hover { border-color: transparent; }

  .btn svg { flex: none; }

  /* ---- QR disclosure ---- */
  .qr {
    margin-top: 1.5rem;
    border: 1px solid var(--edge);
    border-radius: 14px;
    background: rgba(18, 18, 20, .72);
    overflow: hidden;
    text-align: left;
  }
  .qr > summary {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .5rem;
    min-height: 52px;
    padding: .75rem 1rem;
    font-size: .8125rem;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--gold-soft);
    cursor: pointer;
    list-style: none;
    -webkit-tap-highlight-color: transparent;
  }
  .qr > summary::-webkit-details-marker { display: none; }
  .qr > summary::after {
    content: '';
    width: 7px;
    height: 7px;
    border-right: 2px solid currentColor;
    border-bottom: 2px solid currentColor;
    transform: translateY(-2px) rotate(45deg);
    transition: transform .18s ease;
  }
  .qr[open] > summary::after { transform: translateY(1px) rotate(-135deg); }
  .qr > summary:focus-visible { outline: 2px solid var(--gold-soft); outline-offset: -2px; }

  .qr__body {
    padding: 0 1rem 1.25rem;
    text-align: center;
  }
  .qr__code {
    width: 190px;
    height: 190px;
    display: block;
    margin: 0 auto;
    padding: 10px;
    border-radius: 10px;
    background: #fff;   /* QR contrast: dark modules on a true white field */
  }
  .qr__hint {
    margin: .75rem 0 0;
    font-size: .8125rem;
    color: var(--muted);
  }

  footer {
    margin-top: 1.75rem;
    font-size: .75rem;
    letter-spacing: .04em;
    color: rgba(168, 164, 156, .72);
  }
  footer a { color: inherit; text-decoration: none; }
  footer a:hover { color: var(--gold-soft); }
  footer p { margin: .3rem 0; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
